[package]
name = "dibs-bindings"
version = "0.1.0"
edition = "2021"
description = "The thin Python binding over the dibs crate, carrying no logic of its own"
license = "MIT"

[lib]
name = "dibs"
crate-type = ["cdylib", "rlib"]

[dependencies]
dibs-core = { package = "dibs", path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
