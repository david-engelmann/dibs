[package]
name = "dibs-bindings"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "The thin Python binding over the dibs crate, carrying no logic of its own"
license = "MIT"
repository = "https://github.com/david-engelmann/dibs"

[lib]
name = "_dibs"
crate-type = ["cdylib"]

[dependencies]
dibs-core = { package = "dibs-ai", path = ".." }
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[features]
extension-module = ["pyo3/extension-module"]
