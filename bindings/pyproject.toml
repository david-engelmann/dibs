[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "dibs"
version = "0.1.0"
description = "Agents call dibs on tasks with expiring leases, so parallel agents can share one backlog without a central boss handing out work."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "dibs._dibs"
python-source = "../python"
