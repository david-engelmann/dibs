[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "dibs-ai"
version = "1.0.0"
description = "Agents call dibs on tasks with expiring leases, so parallel agents can share one backlog without a central boss handing out work, measured on one shared registry of ten thousand tasks, with every claim accounted for."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["agents", "leases", "claims", "coordination", "backlog"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/david-engelmann/dibs"
Repository = "https://github.com/david-engelmann/dibs"
Documentation = "https://docs.rs/dibs-ai"
Changelog = "https://github.com/david-engelmann/dibs/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "bindings/Cargo.toml"
module-name = "dibs._dibs"
python-source = "python"
features = ["extension-module"]
include = [{ path = "LICENSE", format = ["sdist", "wheel"] }]
exclude = ["tests/**", "crates/**", ".github/**", "Dockerfile", ".dockerignore"]
